<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サンポスター – ポップ版</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Kaisei+Decol:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF8F0;
    --yellow: #FFD93D;
    --green: #6BCB77;
    --green-dark: #3D9E4A;
    --coral: #FF6B6B;
    --blue: #4ECDC4;
    --ink: #1A1A2E;
    --ink-soft: #555566;
    --surface: #FFFFFF;
    --border: #F0E8DC;
    --shadow: rgba(26,26,46,0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #FFE8D6;
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px 16px 40px;
  }

  .phone {
    width: 390px;
    background: var(--bg);
    min-height: 844px;
    border-radius: 48px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    padding: 14px 28px 8px;
    font-size: 12px;
    font-weight: 800;
    color: var(--ink-soft);
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 22px 16px;
  }

  .logo {
    font-family: 'Kaisei Decol', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .logo-star {
    display: inline-flex;
    width: 28px;
    height: 28px;
    background: var(--yellow);
    border-radius: 50%;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    animation: spin 4s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .avatar-wrap {
    position: relative;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--yellow);
    border: 3px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow: 3px 3px 0 var(--ink);
  }

  .avatar-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 16px;
    height: 16px;
    background: var(--coral);
    border: 2px solid var(--bg);
    border-radius: 50%;
    font-size: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 800;
  }

  /* 称えカード */
  .praise-card {
    margin: 0 16px 14px;
    background: var(--yellow);
    border-radius: 24px;
    border: 3px solid var(--ink);
    padding: 22px 22px 18px;
    position: relative;
    box-shadow: 5px 5px 0 var(--ink);
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .praise-stars {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
  }

  .praise-star {
    font-size: 14px;
    animation: twinkle 1.5s ease-in-out infinite;
  }

  .praise-star:nth-child(2) { animation-delay: 0.3s; }
  .praise-star:nth-child(3) { animation-delay: 0.6s; }

  @keyframes twinkle {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3) rotate(10deg); }
  }

  .praise-label {
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.15em;
    color: var(--ink);
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: 8px;
  }

  .praise-text {
    font-size: 17px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.5;
    margin-bottom: 14px;
  }

  .praise-text em {
    font-style: normal;
    background: var(--ink);
    color: var(--yellow);
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 20px;
  }

  .praise-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .praise-tag {
    background: white;
    border: 2px solid var(--ink);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 11px;
    font-weight: 800;
    color: var(--ink);
  }

  /* サマリー */
  .summary-row {
    display: flex;
    gap: 10px;
    margin: 0 16px 14px;
    animation: fadeUp 0.5s 0.1s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .summary-card {
    flex: 1;
    background: var(--surface);
    border-radius: 18px;
    border: 2.5px solid var(--ink);
    padding: 14px 12px;
    box-shadow: 3px 3px 0 var(--ink);
    text-align: center;
  }

  .summary-card.streak {
    background: var(--coral);
  }

  .summary-card.total {
    background: var(--blue);
  }

  .summary-emoji {
    font-size: 18px;
    display: block;
    margin-bottom: 4px;
  }

  .summary-value {
    font-size: 24px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1;
  }

  .summary-card.streak .summary-value,
  .summary-card.total .summary-value {
    color: white;
  }

  .summary-unit {
    font-size: 10px;
    font-weight: 700;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .summary-card.streak .summary-unit,
  .summary-card.total .summary-unit {
    color: rgba(255,255,255,0.8);
  }

  /* 今月カード */
  .month-card {
    margin: 0 16px 14px;
    background: var(--surface);
    border-radius: 20px;
    border: 2.5px solid var(--ink);
    padding: 18px 20px;
    box-shadow: 3px 3px 0 var(--ink);
    animation: fadeUp 0.5s 0.2s ease both;
  }

  .month-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .month-title {
    font-size: 13px;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: 0.05em;
  }

  .month-chip {
    background: var(--green);
    border: 2px solid var(--ink);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 800;
    color: var(--ink);
  }

  .progress-track {
    background: var(--border);
    border-radius: 8px;
    height: 10px;
    margin-bottom: 12px;
    overflow: hidden;
    border: 2px solid var(--ink);
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green) 0%, #9EE86F 100%);
    border-radius: 6px;
    width: 62%;
  }

  .month-stats {
    display: flex;
    justify-content: space-around;
  }

  .month-stat {
    text-align: center;
  }

  .month-stat-value {
    font-size: 16px;
    font-weight: 900;
    color: var(--ink);
  }

  .month-stat-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--ink-soft);
  }

  /* スタートボタン */
  .start-wrap {
    margin: 0 16px 14px;
    animation: fadeUp 0.5s 0.3s ease both;
  }

  .start-btn {
    width: 100%;
    background: var(--green);
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 20px;
    padding: 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 0.05em;
  }

  .start-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 var(--ink);
  }

  /* バッジ */
  .badges-wrap {
    margin: 0 16px 20px;
    animation: fadeUp 0.5s 0.4s ease both;
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: 0.05em;
  }

  .section-link {
    font-size: 12px;
    font-weight: 800;
    color: var(--green-dark);
    text-decoration: none;
  }

  .badges-row {
    display: flex;
    gap: 8px;
  }

  .badge-item {
    flex: 1;
    background: var(--surface);
    border: 2.5px solid var(--ink);
    border-radius: 16px;
    padding: 12px 8px;
    text-align: center;
    box-shadow: 2px 2px 0 var(--ink);
  }

  .badge-item.new {
    background: var(--yellow);
    animation: bounce 0.6s 1s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes bounce {
    from { transform: scale(0.8); }
    to { transform: scale(1); }
  }

  .badge-emoji {
    font-size: 22px;
    display: block;
    margin-bottom: 5px;
  }

  .badge-name {
    font-size: 9px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.3;
  }

  .badge-new {
    display: inline-block;
    background: var(--coral);
    color: white;
    font-size: 8px;
    font-weight: 900;
    padding: 2px 5px;
    border-radius: 4px;
    margin-top: 3px;
    border: 1.5px solid var(--ink);
  }

  /* Bottom nav */
  .bottom-nav {
    margin-top: auto;
    background: var(--surface);
    border-top: 3px solid var(--ink);
    display: flex;
    padding: 12px 0 24px;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .nav-icon-wrap {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-size: 18px;
  }

  .nav-item.active .nav-icon-wrap {
    background: var(--yellow);
    border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
  }

  .nav-label {
    font-size: 9px;
    font-weight: 800;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }

  .nav-item.active .nav-label {
    color: var(--ink);
  }
</style>
</head>
<body>
<div class="phone">

  <div class="status-bar">
    <span>9:41</span>
    <span>●●●</span>
  </div>

  <div class="header">
    <div class="logo">
      <div class="logo-star">⭐</div>
      サンポスター
    </div>
    <div class="avatar-wrap">
      <div class="avatar">🐱</div>
      <div class="avatar-badge">3</div>
    </div>
  </div>

  <!-- 称えカード -->
  <div class="praise-card">
    <div class="praise-stars">
      <span class="praise-star">⭐</span>
      <span class="praise-star">⭐</span>
      <span class="praise-star">⭐</span>
    </div>
    <div class="praise-label">今日のあなた</div>
    <div class="praise-text">
      雨の深夜に歩いた距離、<br>全ユーザー中 <em>5位</em> です。
    </div>
    <div class="praise-tags">
      <span class="praise-tag">🌧️ 雨の日</span>
      <span class="praise-tag">🌙 深夜</span>
      <span class="praise-tag">4月1日</span>
    </div>
  </div>

  <!-- サマリー -->
  <div class="summary-row">
    <div class="summary-card">
      <span class="summary-emoji">🚶</span>
      <div class="summary-value">4.2</div>
      <div class="summary-unit">今日 km</div>
    </div>
    <div class="summary-card streak">
      <span class="summary-emoji">🔥</span>
      <div class="summary-value">12</div>
      <div class="summary-unit">日連続</div>
    </div>
    <div class="summary-card total">
      <span class="summary-emoji">👣</span>
      <div class="summary-value">487</div>
      <div class="summary-unit">累計 km</div>
    </div>
  </div>

  <!-- 今月 -->
  <div class="month-card">
    <div class="month-header">
      <div class="month-title">今月の歩き</div>
      <div class="month-chip">4月</div>
    </div>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
    <div class="month-stats">
      <div class="month-stat">
        <div class="month-stat-value">62.4km</div>
        <div class="month-stat-label">合計</div>
      </div>
      <div class="month-stat">
        <div class="month-stat-value">18回</div>
        <div class="month-stat-label">散歩した日</div>
      </div>
      <div class="month-stat">
        <div class="month-stat-value">3.5km</div>
        <div class="month-stat-label">平均</div>
      </div>
    </div>
  </div>

  <!-- スタートボタン -->
  <div class="start-wrap">
    <button class="start-btn">
      🚶 散歩をはじめる
    </button>
  </div>

  <!-- バッジ -->
  <div class="badges-wrap">
    <div class="section-header">
      <div class="section-title">🏅 最近のバッジ</div>
      <a href="#" class="section-link">すべて →</a>
    </div>
    <div class="badges-row">
      <div class="badge-item new">
        <span class="badge-emoji">🌧️</span>
        <div class="badge-name">雨でも歩く</div>
        <span class="badge-new">NEW</span>
      </div>
      <div class="badge-item">
        <span class="badge-emoji">🌙</span>
        <div class="badge-name">深夜さんぽ</div>
      </div>
      <div class="badge-item">
        <span class="badge-emoji">🔥</span>
        <div class="badge-name">10日連続</div>
      </div>
      <div class="badge-item">
        <span class="badge-emoji">👣</span>
        <div class="badge-name">100km達成</div>
      </div>
    </div>
  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <div class="nav-icon-wrap">🏠</div>
      <span class="nav-label">ホーム</span>
    </div>
    <div class="nav-item">
      <div class="nav-icon-wrap">🗺️</div>
      <span class="nav-label">さんぽを探す</span>
    </div>
    <div class="nav-item">
      <div class="nav-icon-wrap">📍</div>
      <span class="nav-label">きろく</span>
    </div>
    <div class="nav-item">
      <div class="nav-icon-wrap">👤</div>
      <span class="nav-label">マイページ</span>
    </div>
  </div>

</div>
</body>
</html>
